[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytdl"
description = "Download YouTube videos and playlists as MP3 or MP4 (CLI, desktop app, local web UI)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "yt-dlp[default]",   # includes yt-dlp-ejs, needed for YouTube's JS challenges
    "certifi",
    "flask>=3.0",
]
dynamic = ["version"]

[project.optional-dependencies]
desktop = ["pywebview>=5"]
build = ["pywebview>=5", "pyinstaller>=6"]
dev = ["pytest"]

[project.scripts]
ytdl = "ytdl.cli:main"
ytdl-web = "ytdl.web.server:main"

[project.gui-scripts]
ytdl-app = "ytdl.desktop:main"

[tool.setuptools.dynamic]
version = { attr = "ytdl.__version__" }

[tool.setuptools.packages.find]
include = ["ytdl*"]

[tool.setuptools.package-data]
"ytdl.web" = ["static/*"]
